<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data: Basic Interpretation and Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--sf:#fff;--ink:#13233f;--mu:#52627a;--ln:#d5dde8;--ac:#0d6e72;--as:#dff1f0;--wn:#b3261e;--ws:#fbe6e4;--ok:#1d7a46;--os:#e0f3e7;--hero:#13233f;--hi:#f3f6f9;--ser:"Newsreader",Georgia,serif;--san:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--sf:#17233a;--ink:#e8eef7;--mu:#9fb0c8;--ln:#2b3a55;--ac:#4fc3bf;--as:#16363a;--wn:#ff8a80;--ws:#3a1f22;--ok:#6fd49a;--os:#18332a;--hero:#0a1120;--hi:#e8eef7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--sf:#17233a;--ink:#e8eef7;--mu:#9fb0c8;--ln:#2b3a55;--ac:#4fc3bf;--as:#16363a;--wn:#ff8a80;--ws:#3a1f22;--ok:#6fd49a;--os:#18332a;--hero:#0a1120;--hi:#e8eef7;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 clamp(16px,1vw + 11px,18px)/1.6 var(--san);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3{font-family:var(--ser);line-height:1.15;margin:0}
h3{font-size:1.15rem}p{margin:.5em 0;max-width:68ch}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
.app{display:block}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav b{display:none;font:700 1.05rem var(--ser);padding:6px 12px}
nav button{flex:none;border:0;background:none;color:var(--mu);border-radius:99px;padding:8px 14px;font:500 .9rem var(--san);cursor:pointer;min-height:40px;text-align:left}
nav button.on,nav button:hover{background:var(--as);color:var(--ac)}
nav button.on{font-weight:600}
nav button.d::after{content:" ✓"}
main{max-width:980px;margin:0 auto;padding:clamp(18px,4vw,44px) clamp(16px,4vw,48px) 56px}
.hero{background:var(--hero);color:var(--hi);border-radius:20px;padding:clamp(22px,5vw,48px)}
.hero h1{font-size:clamp(1.9rem,5vw,3.2rem);max-width:18ch}
.hero p{opacity:.8}
.pill{display:inline-block;border:1px solid currentColor;opacity:.75;border-radius:99px;padding:3px 12px;font-size:.82rem;margin:12px 8px 0 0}
.mh h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.lede{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:clamp(14px,3vw,24px);margin-top:16px}
.grid{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.grid .card{margin:0;padding:16px}.grid p{color:var(--mu);font-size:.93rem;margin:.3em 0 0}
.grid button.card{text-align:left;font:inherit;color:inherit;cursor:pointer}.grid button.card:hover{border-color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tags span{background:var(--as);color:var(--ac);padding:3px 12px;border-radius:99px;font-size:.86rem;font-weight:500}
.tags.bad span{background:var(--ws);color:var(--wn)}
.act{border-left:4px solid var(--ac);border-radius:4px 16px 16px 4px}
.out{background:var(--os);border:0}
.split{display:grid;gap:16px}
code{font:500 .88em ui-monospace,Menlo,Consolas,monospace;background:var(--as);padding:1px 6px;border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
button.btn{font:600 1rem var(--san);cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:10px 16px;border-radius:10px;min-height:44px}
button.btn:hover{border-color:var(--ac)}button.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
[data-theme="dark"] button.btn.p{color:#06201f}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.opts{display:grid;gap:8px}.opts .btn{text-align:left;font-weight:500}
.right{background:var(--os)!important;border-color:var(--ok)!important}.wrong{background:var(--ws)!important;border-color:var(--wn)!important}
.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--as);font-size:.95rem}
.q h3{font:600 1.05rem/1.4 var(--san);margin-bottom:10px}
.sc{font:700 1.4rem var(--ser);margin-top:14px}
details{border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin-top:10px;background:var(--bg)}
summary{cursor:pointer;font-weight:600;min-height:28px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.ck{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.ck label{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);cursor:pointer}
.ck input{width:22px;height:22px;flex:none;accent-color:var(--ac);margin-top:2px}.ck span{display:block;color:var(--mu);font-size:.9rem}
svg{width:100%;height:auto;display:block;max-height:44vh}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
.ro{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.ro div{flex:1 1 130px;padding:8px 12px;border-radius:12px;background:var(--as)}.ro .w{background:var(--ws)}.ro b{display:block;font:700 1.5rem var(--ser)}.ro small{color:var(--mu)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;list-style:none;margin:14px 0 0}
.steps li{counter-increment:s;display:flex;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--sf);display:grid;place-items:center;font-weight:700}
.steps span{display:block;color:var(--mu);font-size:.92rem}
.nx{margin-top:28px;display:flex;justify-content:space-between;gap:8px}
.gv{display:block;margin-bottom:8px}.gv svg{max-height:100px;width:100%}
.c1{fill:var(--ac)}.c2{fill:#d9962b}.c3{fill:#6f86d6}.c4{fill:var(--wn)}.soft{opacity:.4}.hole{fill:var(--sf)}
.ax{stroke:var(--mu);fill:none;stroke-width:1.5}.ln{stroke:var(--ac);stroke-width:3;fill:none;stroke-linejoin:round}.ln2{stroke:#d9962b;stroke-width:3;fill:none;stroke-linejoin:round}
.gal .card h3{font-size:1.05rem}.gal .card p b{color:var(--ink)}
@media (min-width:700px) and (orientation:landscape),(min-width:1000px){
 .app{display:grid;grid-template-columns:240px 1fr}
 nav{flex-direction:column;overflow:auto;border:0;border-right:1px solid var(--ln);height:calc(100vh - env(safe-area-inset-top,0px));padding:14px 10px}
 nav b{display:block}nav button{border-radius:10px;white-space:normal}
 .split{grid-template-columns:1fr 1fr;align-items:start}
}
@media (orientation:landscape) and (max-height:500px){svg{max-height:62vh}.hero{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
